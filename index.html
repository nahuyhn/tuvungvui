    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #eeebff;
            --primary-dark: #3730a3;
            --secondary: #0ea5e9;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-md: 0 10px 25px -5px rgba(79, 70, 229, 0.1), 0 8px 10px -6px rgba(79, 70, 229, 0.1);
            --shadow-card: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            max-width: 600px;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--text-main);
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Tabs Navigation */
        .tabs-container {
            display: flex;
            background: #e2e8f0;
            padding: 0.4rem;
            border-radius: var(--radius-md);
            margin-bottom: 2.5rem;
            width: 100%;
            max-width: 650px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
        }

        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 0.8rem 1rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            text-align: center;
        }

        .tab-btn.active {
            background: var(--bg-card);
            color: var(--primary);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.12);
        }

        /* Main Workspace */
        .workspace {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Flashcard Container */
        .flashcard-wrapper {
            perspective: 1000px;
            width: 100%;
            height: 320px;
            cursor: pointer;
            margin-bottom: 2rem;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2.5rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .card-front {
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
            color: var(--text-main);
        }

        .card-back {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            transform: rotateY(180deg);
        }

        .card-topic {
            position: absolute;
            top: 1.5rem;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
        }

        .card-front .card-topic {
            background: var(--primary-light);
            color: var(--primary);
        }

        .card-back .card-topic {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .card-word {
            font-size: 2.4rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            word-break: break-word;
        }

        .card-front .card-word {
            color: var(--text-main);
        }

        .card-back .card-word {
            color: #ffffff;
        }

        .card-hint {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-back .card-hint {
            color: rgba(255, 255, 255, 0.7);
        }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 2rem;
            gap: 1rem;
        }

        .btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 0.9rem 1.5rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            color: var(--text-main);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            box-shadow: var(--shadow-sm);
        }

        .btn:hover {
            background: var(--primary-light);
            color: var(--primary);
            border-color: var(--primary-light);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .progress-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            background: #e2e8f0;
            padding: 0.4rem 1rem;
            border-radius: 20px;
        }

        /* Summary Grid View */
        .quick-view-section {
            width: 100%;
            max-width: 750px;
            margin-top: 2rem;
            background: var(--bg-card);
            padding: 2rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border);
        }

        .quick-view-section h3 {
            font-size: 1.2rem;
            margin-bottom: 1.2rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .quick-view-section h3 span {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .words-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 0.6rem;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        /* Custom Scrollbar */
        .words-grid::-webkit-scrollbar {
            width: 6px;
        }
        .words-grid::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        .words-grid::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .grid-item {
            background: var(--bg-main);
            border: 1px solid var(--border);
            padding: 0.6rem;
            border-radius: var(--radius-sm);
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .grid-item:hover, .grid-item.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
        }

        @media (max-width: 480px) {
            header h1 { font-size: 1.8rem; }
            .flashcard-wrapper { height: 280px; }
            .card-word { font-size: 2rem; }
            .tab-btn { font-size: 0.85rem; padding: 0.6rem 0.5rem; }
            .btn { padding: 0.7rem 1rem; font-size: 0.85rem; }
        }
    </style>
</head>

                { id: 88, topic: "Môi trường & Giao thông", eng: "Balcony", vie: "Ban công" },
                { id: 89, topic: "Môi trường & Giao thông", eng: "Cathedral", vie: "Nhà thờ lớn" },
                { id: 90, topic: "Môi trường & Giao thông", eng: "Environment", vie: "Môi trường" },
                { id: 91, topic: "Môi trường & Giao thông", eng: "Historical / Heritage", vie: "Thuộc về lịch sử / Di sản" },
                { id: 92, topic: "Môi trường & Giao thông", eng: "Independence", vie: "Sự độc lập" },
                { id: 93, topic: "Môi trường & Giao thông", eng: "Museum", vie: "Bảo tàng" },
                { id: 94, topic: "Môi trường & Giao thông", eng: "Pollution", vie: "Sự ô nhiễm" },
                { id: 95, topic: "Môi trường & Giao thông", eng: "Temperature", vie: "Nhiệt độ" },
                { id: 96, topic: "Môi trường & Giao thông", eng: "Transport", vie: "Giao thông, phương tiện" },
                { id: 97, topic: "Môi trường & Giao thông", eng: "Vehicle", vie: "Phương tiện" },
                { id: 98, topic: "Môi trường & Giao thông", eng: "Village", vie: "Ngôi làng" },
                { id: 99, topic: "Môi trường & Giao thông", eng: "Weather", vie: "Thời tiết" },
                { id: 100, topic: "Môi trường & Giao thông", eng: "Wildlife", vie: "Động vật hoang dã" }
            ]
        ];

        let currentPage = 0;
        let currentCardIndex = 0;

        const cardEl = document.getElementById('card');
        const engEl = document.getElementById('card-eng');
        const vieEl = document.getElementById('card-vie');
        const topicFrontEl = document.getElementById('card-topic-front');
        const topicBackEl = document.getElementById('card-topic-back');
        const progressEl = document.getElementById('progress');
        const gridContainer = document.getElementById('words-grid');
        const gridCountEl = document.getElementById('grid-count');

        function updateCard() {
            // Reset flipping state before updating text
            cardEl.classList.remove('flipped');
            
            const currentList = dataset[currentPage];
            const item = currentList[currentCardIndex];

            // Update content after a short delay if it was flipped to look smooth
            setTimeout(() => {
                engEl.textContent = item.eng;
                vieEl.textContent = item.vie;
                topicFrontEl.textContent = `Nó. ${item.id} | ${item.topic}`;
                topicBackEl.textContent = `Nó. ${item.id} | ${item.topic}`;
                progressEl.textContent = `${currentCardIndex + 1} / ${currentList.length}`;
                
                // Update active grid item
                document.querySelectorAll('.grid-item').forEach((btn, idx) => {
                    if (idx === currentCardIndex) {
                        btn.classList.add('active');
                        btn.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                    } else {
                        btn.classList.remove('active');
                    }
                });
            }, 50);
        }

        function flipCard() {
            cardEl.classList.toggle('flipped');
        }

        function nextCard(event) {
            if (event) event.stopPropagation();
            const currentList = dataset[currentPage];
            currentCardIndex = (currentCardIndex + 1) % currentList.length;
            updateCard();
        }

        function prevCard(event) {
            if (event) event.stopPropagation();
            const currentList = dataset[currentPage];
            currentCardIndex = (currentCardIndex - 1 + currentList.length) % currentList.length;
            updateCard();
        }

        function switchPage(pageIndex) {
            currentPage = pageIndex;
            currentCardIndex = 0;
            
            // Update active tab style
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach((tab, idx) => {
                if (idx === pageIndex) tab.classList.add('active');
                else tab.classList.remove('active');
            });

            // Build grid for quick reference
            buildGrid();
            updateCard();
        }

        function buildGrid() {
            gridContainer.innerHTML = '';
            const currentList = dataset[currentPage];
            gridCountEl.textContent = `${currentList.length} từ`;

            currentList.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'grid-item';
                div.textContent = item.eng.split(' (')[0]; // short version
                div.title = `${item.eng} : ${item.vie}`;
                div.onclick = (e) => {
                    e.stopPropagation();
                    currentCardIndex = index;
                    updateCard();
                };
                gridContainer.appendChild(div);
            });
        }

        // Keyboard Support
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault();
                flipCard();
            } else if (e.key === 'ArrowRight') {
                nextCard();
            } else if (e.key === 'ArrowLeft') {
                prevCard();
            }
        });

        // Initialize App
        buildGrid();
        updateCard();
    </script>
</body>
</html>
