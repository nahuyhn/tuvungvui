<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Giao Thông & Thời Tiết</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h2 {
            margin: 0 0 10px 0;
            color: #ff5722;
        }

        .counter {
            font-weight: bold;
            color: #6c757d;
            font-size: 16px;
        }

        /* Flashcard Styles */
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            height: 260px;
            margin-bottom: 30px;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-radius: 20px;
        }

        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .card-front {
            background-color: #ffffff;
            border-bottom: 6px solid #ff5722;
        }

        .card-back {
            background-color: #fff3e0;
            transform: rotateY(180deg);
            border-bottom: 6px solid #4caf50;
        }

        .word {
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #212529;
        }

        .ipa {
            font-size: 20px;
            color: #6c757d;
            font-style: italic;
        }

        .meaning {
            font-size: 30px;
            font-weight: 700;
            color: #2e7d32;
        }

        .instruction {
            font-size: 13px;
            color: #adb5bd;
            position: absolute;
            bottom: 20px;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 15px;
        }

        button {
            flex: 1;
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        button:hover:not(:disabled) {
            background-color: #e64a19;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #e9ecef;
            cursor: not-allowed;
            color: #a8aeb4;
        }

        /* ==========================================================================
   GIAO DIỆN DÀNH CHO MÀN HÌNH ĐIỆN THOẠI (Mobile) - Max width 480px
   ========================================================================== */
@media screen and (max-width: 480px) {
    
    /* 1. Tối ưu lại container chứa nội dung */
    .container {
        width: 100% !important;
        max-width: 100% !important;
        padding: 15px !important; /* Thu nhỏ padding để tăng không gian hiển thị */
        margin: 0 auto;
        box-shadow: none !important; /* Bỏ bóng đổ cho nhẹ máy và thoáng màn hình */
        border: none !important; /* Bỏ viền nếu cần thiết */
    }

    /* 2. Ép các lưới (Grid) hoặc hàng (Flexbox) về dạng 1 cột dọc */
    .menu-grid, .grid-layout, .row {
        display: grid !important;
        grid-template-columns: 1fr !important; /* Chuyển thành 1 cột duy nhất */
        gap: 12px !important;
    }

    /* 3. Điều chỉnh lại kích thước chữ (Font size) cho vừa mắt trên phone */
    h1 {
        font-size: 20px !important; /* Giảm size tiêu đề chính */
        margin-bottom: 8px !important;
    }

    h2 {
        font-size: 18px !important;
    }

    p, span, a {
        font-size: 14px !important; /* Size chữ body chuẩn trên mobile */
    }

    /* 4. Tối ưu hóa các nút bấm (Button / Link) cho dễ chạm bằng ngón tay */
    .btn-link, button, .button {
        padding: 12px !important; /* Không gian vừa đủ để ngón tay dễ ấn */
        font-size: 15px !important;
        width: 100%; /* Cho nút trải dài hết chiều ngang màn hình */
        box-sizing: border-box;
    }
}
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Giao Thông & Thời Tiết</h2>
            <div class="counter"><span id="current-count">1</span> / <span id="total-count">0</span></div>
        </div>

        <div class="flashcard-container" onclick="flipCard()">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front">
                    <div class="word" id="en-word">Word</div>
                    <div class="ipa" id="ipa-text">/ipa/</div>
                    <div class="instruction">Nhấp vào thẻ để xem nghĩa</div>
                </div>
                <div class="card-face card-back">
                    <div class="meaning" id="vi-meaning">Nghĩa</div>
                    <div class="instruction">Nhấp vào thẻ để xem từ</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="prev-btn" onclick="prevCard()">&#8592; Quay lại</button>
            <button id="next-btn" onclick="nextCard()">Tiếp theo &#8594;</button>
        </div>
    </div>

    <script>
        const flashcards = [
            { en: "Crossroads", ipa: "/ˈkrɒs.roʊdz/", vi: "Ngã tư giao lộ" },
            { en: "Crossing", ipa: "/ˈkrɒs.ɪŋ/", vi: "Chỗ qua đường" },
            { en: "Cyclist", ipa: "/ˈsaɪ.klɪst/", vi: "Người đi xe đạp" },
            { en: "Depart", ipa: "/dɪˈpɑːrt/", vi: "Khởi hành" },
            { en: "Departure", ipa: "/dɪˈpɑːr.tʃər/", vi: "Sự khởi hành" },
            { en: "Due", ipa: "/duː/", vi: "Đến hạn, dự kiến" },
            { en: "Embassy", ipa: "/ˈem.bə.si/", vi: "Đại sứ quán" },
            { en: "Duty-free", ipa: "/ˌduː.t̬iˈfriː/", vi: "Hàng miễn thuế" },
            { en: "Exchange rate", ipa: "/ɪksˈtʃeɪndʒ reɪt/", vi: "Tỷ giá hối đoái" },
            { en: "Facilities", ipa: "/fəˈsɪl.ə.tiz/", vi: "Cơ sở vật chất" },
            { en: "Fare", ipa: "/fer/", vi: "Tiền xe, giá vé" },
            { en: "Ferry", ipa: "/ˈfer.i/", vi: "Phà" },
            { en: "Flight", ipa: "/flaɪt/", vi: "Chuyến bay" },
            { en: "Fuel", ipa: "/ˈfjuː.əl/", vi: "Nhiên liệu" },
            { en: "Guidebook", ipa: "/ˈɡaɪd.bʊk/", vi: "Sách hướng dẫn" },
            { en: "Guide", ipa: "/ɡaɪd/", vi: "Hướng dẫn viên" },
            { en: "Handlebars", ipa: "/ˈhæn.dəl.bɑːrz/", vi: "Ghi-đông, tay lái" },
            { en: "Harbour", ipa: "/ˈhɑːr.bɚ/", vi: "Bến cảng" },
            { en: "Helicopter", ipa: "/ˈhel.əˌkɑːp.tɚ/", vi: "Trực thăng" },
            { en: "Hitchhike", ipa: "/ˈhɪtʃ.haɪk/", vi: "Đi nhờ xe" },
            { en: "Immigration", ipa: "/ˌɪm.əˈɡreɪ.ʃən/", vi: "Khu vực nhập cảnh" },
            { en: "Lorry", ipa: "/ˈlɔːr.i/", vi: "Xe tải" },
            { en: "Luggage", ipa: "/ˈlʌɡ.ɪdʒ/", vi: "Hành lý" },
            { en: "Motorway", ipa: "/ˈmoʊ.t̬ɚ.weɪ/", vi: "Đường cao tốc" },
            { en: "Mirror", ipa: "/ˈmɪr.ɚ/", vi: "Gương chiếu hậu" },
            { en: "On business", ipa: "/ɑːn ˈbɪz.nɪs/", vi: "Đi công tác" },
            { en: "Operator", ipa: "/ˈɑː.pə.reɪ.t̬ɚ/", vi: "Người vận hành" },
            { en: "Passenger", ipa: "/ˈpæs.ən.dʒɚ/", vi: "Hành khách" },
            { en: "Railroad / Railway", ipa: "/ˈreɪl.roʊd/", vi: "Đường sắt" },
            { en: "Reservation", ipa: "/ˌrez.ɚˈveɪ.ʃən/", vi: "Sự đặt chỗ trước" },
            { en: "Road sign", ipa: "/roʊd saɪn/", vi: "Biển báo giao thông" },
            { en: "Roundabout", ipa: "/ˈraʊnd.ə.baʊt/", vi: "Vòng xuyến" },
            { en: "Sightseeing", ipa: "/ˈsaɪtˌsiː.ɪŋ/", vi: "Tham quan ngắm cảnh" },
            { en: "Signpost", ipa: "/ˈsaɪn.poʊst/", vi: "Biển chỉ đường" },
            { en: "Subway", ipa: "/ˈsʌb.weɪ/", vi: "Tàu điện ngầm" },
            { en: "Suitcase", ipa: "/ˈsuːt.keɪs/", vi: "Va-li" },
            { en: "Take off", ipa: "/teɪk ɔːf/", vi: "Cất cánh" },
            { en: "Traffic jam", ipa: "/ˈtræf.ɪk dʒæm/", vi: "Tắc đường" },
            { en: "Tunnel", ipa: "/ˈtʌn.əl/", vi: "Đường hầm" },
            { en: "Tyre / Tire", ipa: "/taɪr/", vi: "Lốp xe" },
            { en: "Vehicle", ipa: "/ˈviː.ə.kəl/", vi: "Phương tiện giao thông" },
            { en: "Wheel", ipa: "/wiːl/", vi: "Bánh xe" },
            { en: "Windscreen", ipa: "/ˈwɪnd.skriːn/", vi: "Kính chắn gió" },
            { en: "Centigrade", ipa: "/ˈsen.t̬ə.ɡreɪd/", vi: "Độ C" },
            { en: "Fog / Foggy", ipa: "/fɑːɡ / ˈfɑːɡ.i/", vi: "Sương mù / Có sương mù" },
            { en: "Forecast", ipa: "/ˈfɔːr.kæst/", vi: "Dự báo thời tiết" },
            { en: "Gale", ipa: "/ɡeɪl/", vi: "Gió giật mạnh" },
            { en: "Get wet", ipa: "/ɡet wet/", vi: "Bị ướt" },
            { en: "Humid", ipa: "/ˈhjuː.mɪd/", vi: "Ẩm ướt" },
            { en: "Lightning", ipa: "/ˈlaɪt.nɪŋ/", vi: "Tia chớp" },
            { en: "Mild", ipa: "/maɪld/", vi: "Ôn hòa, ấm áp" },
            { en: "Storm", ipa: "/stɔːrm/", vi: "Cơn bão" }
        ];

        let currentIndex = 0;

        const cardElement = document.getElementById('flashcard');
        const enWord = document.getElementById('en-word');
        const ipaText = document.getElementById('ipa-text');
        const viMeaning = document.getElementById('vi-meaning');
        const currentCountText = document.getElementById('current-count');
        const totalCountText = document.getElementById('total-count');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function init() {
            totalCountText.textContent = flashcards.length;
            updateCard();
        }

        function updateCard() {
            cardElement.classList.remove('is-flipped');
            
            setTimeout(() => {
                const card = flashcards[currentIndex];
                enWord.textContent = card.en;
                ipaText.textContent = card.ipa;
                viMeaning.textContent = card.vi;
                currentCountText.textContent = currentIndex + 1;
                
                prevBtn.disabled = currentIndex === 0;
                nextBtn.disabled = currentIndex === flashcards.length - 1;
            }, 200);
        }

        function flipCard() {
            cardElement.classList.toggle('is-flipped');
        }

        function nextCard() {
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        init();
    </script>
</body>
</html>
