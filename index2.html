<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Thiên Nhiên & Du Lịch</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f7f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h2 {
            margin: 0 0 10px 0;
            color: #00897b;
        }

        .counter {
            font-weight: bold;
            color: #546e7a;
            font-size: 16px;
        }

        /* Flashcard Styles */
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            height: 260px;
            margin-bottom: 30px;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-radius: 20px;
        }

        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .card-front {
            background-color: #ffffff;
            border-bottom: 6px solid #00897b;
        }

        .card-back {
            background-color: #e0f2f1;
            transform: rotateY(180deg);
            border-bottom: 6px solid #0277bd;
        }

        .word {
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #263238;
        }

        .ipa {
            font-size: 20px;
            color: #546e7a;
            font-style: italic;
        }

        .meaning {
            font-size: 30px;
            font-weight: 700;
            color: #01579b;
        }

        .instruction {
            font-size: 13px;
            color: #90a4ae;
            position: absolute;
            bottom: 20px;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 15px;
        }

        button {
            flex: 1;
            background-color: #00897b;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        button:hover:not(:disabled) {
            background-color: #00695c;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #cfd8dc;
            cursor: not-allowed;
            color: #78909c;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Thiên Nhiên & Du Lịch</h2>
            <div class="counter"><span id="current-count">1</span> / <span id="total-count">0</span></div>
        </div>

        <div class="flashcard-container" onclick="flipCard()">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front">
                    <div class="word" id="en-word">Word</div>
                    <div class="ipa" id="ipa-text">/ipa/</div>
                    <div class="instruction">Nhấp vào thẻ để xem nghĩa</div>
                </div>
                <div class="card-face card-back">
                    <div class="meaning" id="vi-meaning">Nghĩa</div>
                    <div class="instruction">Nhấp vào thẻ để xem từ</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="prev-btn" onclick="prevCard()">&#8592; Quay lại</button>
            <button id="next-btn" onclick="nextCard()">Tiếp theo &#8594;</button>
        </div>
    </div>

    <script>
        const flashcards = [
            { en: "Abroad", ipa: "/əˈbrɔːd/", vi: "Ở nước ngoài" },
            { en: "Accommodation", ipa: "/əˌkɑː.məˈdeɪ.ʃən/", vi: "Chỗ ở" },
            { en: "Announcement", ipa: "/əˈnaʊns.mənt/", vi: "Thông báo" },
            { en: "Appointment", ipa: "/əˈpɔɪnt.mənt/", vi: "Cuộc hẹn" },
            { en: "Arrival", ipa: "/əˈraɪ.vəl/", vi: "Sự đến nơi" },
            { en: "Backpack", ipa: "/ˈbæk.pæk/", vi: "Ba-lô" },
            { en: "Baggage", ipa: "/ˈbæɡ.ɪdʒ/", vi: "Hành lý" },
            { en: "Canal", ipa: "/kəˈnæl/", vi: "Kênh đào" },
            { en: "Charter", ipa: "/ˈtʃɑːr.t̬ɚ/", vi: "Thuê bao (chuyến bay, tàu)" },
            { en: "Cliff", ipa: "/klɪf/", vi: "Vách đá" },
            { en: "Climate", ipa: "/ˈklaɪ.mət/", vi: "Khí hậu" },
            { en: "Coast", ipa: "/koʊst/", vi: "Bờ biển" },
            { en: "Continent", ipa: "/ˈkɑːn.t̬ən.ənt/", vi: "Lục địa" },
            { en: "Desert", ipa: "/ˈdez.ɚt/", vi: "Sa mạc" },
            { en: "Dessert", ipa: "/dɪˈzɝːt/", vi: "Món tráng miệng" },
            { en: "East", ipa: "/iːst/", vi: "Hướng đông" },
            { en: "Explore", ipa: "/ɪkˈsplɔːr/", vi: "Khám phá" },
            { en: "Farmland", ipa: "/ˈfɑːrm.lænd/", vi: "Đất nông nghiệp" },
            { en: "Flood", ipa: "/flʌd/", vi: "Lũ lụt" },
            { en: "Fur", ipa: "/fɝː/", vi: "Lông thú" },
            { en: "Giraffe", ipa: "/dʒɪˈræf/", vi: "Hươu cao cổ" },
            { en: "Grow", ipa: "/ɡroʊ/", vi: "Mọc, phát triển, trồng trọt" },
            { en: "Hill", ipa: "/hɪl/", vi: "Ngọn đồi" },
            { en: "Mosquito", ipa: "/məˈskiː.t̬oʊ/", vi: "Con muỗi" },
            { en: "Parrot", ipa: "/ˈper.ət/", vi: "Con vẹt" },
            { en: "Penguin", ipa: "/ˈpeŋ.ɡwɪn/", vi: "Chim cánh cụt" },
            { en: "Planet", ipa: "/ˈplæn.ɪt/", vi: "Hành tinh" },
            { en: "Pollution", ipa: "/pəˈluː.ʃən/", vi: "Sự ô nhiễm" },
            { en: "Rainforest", ipa: "/ˈreɪn.fɔːr.ɪst/", vi: "Rừng mưa nhiệt đới" },
            { en: "Sand", ipa: "/sænd/", vi: "Cát" },
            { en: "Scenery", ipa: "/ˈsiː.nɚ.i/", vi: "Phong cảnh" },
            { en: "Valley", ipa: "/ˈvæl.i/", vi: "Thung lũng" },
            { en: "Waterfall", ipa: "/ˈwɑː.t̬ɚ.fɑːl/", vi: "Thác nước" },
            { en: "Waves", ipa: "/weɪvz/", vi: "Những cơn sóng" },
            { en: "Weekday", ipa: "/ˈwiːk.deɪ/", vi: "Ngày trong tuần" },
            { en: "Wildlife", ipa: "/ˈwaɪld.laɪf/", vi: "Động thực vật hoang dã" },
            { en: "Zebra", ipa: "/ˈziː.brə/", vi: "Ngựa vằn" }
        ];

        let currentIndex = 0;

        const cardElement = document.getElementById('flashcard');
        const enWord = document.getElementById('en-word');
        const ipaText = document.getElementById('ipa-text');
        const viMeaning = document.getElementById('vi-meaning');
        const currentCountText = document.getElementById('current-count');
        const totalCountText = document.getElementById('total-count');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function init() {
            totalCountText.textContent = flashcards.length;
            updateCard();
        }

        function updateCard() {
            cardElement.classList.remove('is-flipped');
            
            setTimeout(() => {
                const card = flashcards[currentIndex];
                enWord.textContent = card.en;
                ipaText.textContent = card.ipa;
                viMeaning.textContent = card.vi;
                currentCountText.textContent = currentIndex + 1;
                
                prevBtn.disabled = currentIndex === 0;
                nextBtn.disabled = currentIndex === flashcards.length - 1;
            }, 200);
        }

        function flipCard() {
            cardElement.classList.toggle('is-flipped');
        }

        function nextCard() {
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        init();
    </script>
</body>
</html>
