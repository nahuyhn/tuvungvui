<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Mua Sắm & Thể Thao</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3e5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h2 {
            margin: 0 0 10px 0;
            color: #7b1fa2;
        }

        .counter {
            font-weight: bold;
            color: #757575;
            font-size: 16px;
        }

        /* Flashcard Styles */
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            height: 260px;
            margin-bottom: 30px;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-radius: 20px;
        }

        .flashcard.is-flipped {
            transform: rotateX(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .card-front {
            background-color: #ffffff;
            border-bottom: 6px solid #7b1fa2;
        }

        .card-back {
            background-color: #f8bbd0;
            transform: rotateX(180deg);
            border-bottom: 6px solid #c2185b;
        }

        .word {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #4a148c;
        }

        .ipa {
            font-size: 20px;
            color: #757575;
            font-style: italic;
        }

        .meaning {
            font-size: 28px;
            font-weight: 700;
            color: #880e4f;
        }

        .instruction {
            font-size: 13px;
            color: #9e9e9e;
            position: absolute;
            bottom: 20px;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 15px;
        }

        button {
            flex: 1;
            background-color: #7b1fa2;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        button:hover:not(:disabled) {
            background-color: #4a148c;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #e0e0e0;
            cursor: not-allowed;
            color: #9e9e9e;
        }
        /* ==========================================================================
   GIAO DIỆN DÀNH CHO MÀN HÌNH ĐIỆN THOẠI (Mobile) - Max width 480px
   ========================================================================== */
@media screen and (max-width: 480px) {
    
    /* 1. Tối ưu lại container chứa nội dung */
    .container {
        width: 100% !important;
        max-width: 100% !important;
        padding: 15px !important; /* Thu nhỏ padding để tăng không gian hiển thị */
        margin: 0 auto;
        box-shadow: none !important; /* Bỏ bóng đổ cho nhẹ máy và thoáng màn hình */
        border: none !important; /* Bỏ viền nếu cần thiết */
    }

    /* 2. Ép các lưới (Grid) hoặc hàng (Flexbox) về dạng 1 cột dọc */
    .menu-grid, .grid-layout, .row {
        display: grid !important;
        grid-template-columns: 1fr !important; /* Chuyển thành 1 cột duy nhất */
        gap: 12px !important;
    }

    /* 3. Điều chỉnh lại kích thước chữ (Font size) cho vừa mắt trên phone */
    h1 {
        font-size: 20px !important; /* Giảm size tiêu đề chính */
        margin-bottom: 8px !important;
    }

    h2 {
        font-size: 18px !important;
    }

    p, span, a {
        font-size: 14px !important; /* Size chữ body chuẩn trên mobile */
    }

    /* 4. Tối ưu hóa các nút bấm (Button / Link) cho dễ chạm bằng ngón tay */
    .btn-link, button, .button {
        padding: 12px !important; /* Không gian vừa đủ để ngón tay dễ ấn */
        font-size: 15px !important;
        width: 100%; /* Cho nút trải dài hết chiều ngang màn hình */
        box-sizing: border-box;
    }
}
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Mua Sắm & Thể Thao</h2>
            <div class="counter"><span id="current-count">1</span> / <span id="total-count">0</span></div>
        </div>

        <div class="flashcard-container" onclick="flipCard()">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front">
                    <div class="word" id="en-word">Word</div>
                    <div class="ipa" id="ipa-text">/ipa/</div>
                    <div class="instruction">Nhấp vào thẻ để xem nghĩa</div>
                </div>
                <div class="card-face card-back">
                    <div class="meaning" id="vi-meaning">Nghĩa</div>
                    <div class="instruction">Nhấp vào thẻ để xem từ</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="prev-btn" onclick="prevCard()">&#8592; Quay lại</button>
            <button id="next-btn" onclick="nextCard()">Tiếp theo &#8594;</button>
        </div>
    </div>

    <script>
        const flashcards = [
            { en: "Advertise", ipa: "/ˈæd.vɚ.taɪz/", vi: "Quảng cáo (động từ)" },
            { en: "Bargain", ipa: "/ˈbɑːr.ɡɪn/", vi: "Món hời, sự trả giá" },
            { en: "Cheque", ipa: "/tʃek/", vi: "Tấm séc" },
            { en: "Complain", ipa: "/kəmˈpleɪn/", vi: "Phàn nàn, khiếu nại" },
            { en: "Damaged", ipa: "/ˈdæm.ɪdʒd/", vi: "Bị hư hỏng" },
            { en: "Dear", ipa: "/dɪr/", vi: "Đắt đỏ" },
            { en: "Deposit", ipa: "/dɪˈpɑː.zɪt/", vi: "Tiền đặt cọc" },
            { en: "Hire", ipa: "/haɪr/", vi: "Thuê mướn" },
            { en: "Inexpensive", ipa: "/ˌɪn.ɪkˈspen.sɪv/", vi: "Không đắt, rẻ" },
            { en: "Expensive", ipa: "/ɪkˈspen.sɪv/", vi: "Đắt tiền" },
            { en: "Penny", ipa: "/ˈpen.i/", vi: "Đồng xu (penny)" },
            { en: "Reasonable", ipa: "/ˈriː.zən.ə.bəl/", vi: "Hợp lý, phải chăng" },
            { en: "Reduce", ipa: "/rɪˈduːs/", vi: "Giảm (giá)" },
            { en: "Reserve", ipa: "/rɪˈzɝːv/", vi: "Đặt trước / Cầu thủ dự bị" },
            { en: "Spend", ipa: "/spend/", vi: "Tiêu (tiền)" },
            { en: "Bat", ipa: "/bæt/", vi: "Gậy đánh bóng" },
            { en: "Bathing suit", ipa: "/ˈbeɪ.ðɪŋ ˌsuːt/", vi: "Đồ bơi" },
            { en: "Boat", ipa: "/boʊt/", vi: "Con thuyền" },
            { en: "Changing room", ipa: "/ˈtʃeɪn.dʒɪŋ ˌruːm/", vi: "Phòng thay đồ" },
            { en: "Climbing", ipa: "/ˈklaɪ.mɪŋ/", vi: "Môn leo núi" },
            { en: "Competition", ipa: "/ˌkɑːm.pəˈtɪʃ.ən/", vi: "Cuộc thi, giải đấu" },
            { en: "Court", ipa: "/kɔːrt/", vi: "Sân đấu" },
            { en: "Cricket", ipa: "/ˈkrɪk.ɪt/", vi: "Môn bóng gậy" },
            { en: "Extreme", ipa: "/ɪkˈstriːm/", vi: "Khắc nghiệt, mạo hiểm" },
            { en: "Helmet", ipa: "/ˈhel.mət/", vi: "Mũ bảo hiểm" },
            { en: "Hockey", ipa: "/ˈhɑː.ki/", vi: "Khúc côn cầu" },
            { en: "Jogging", ipa: "/ˈdʒɑː.ɡɪŋ/", vi: "Chạy bộ chậm" },
            { en: "Racket", ipa: "/ˈræk.ɪt/", vi: "Cây vợt" },
            { en: "Rugby", ipa: "/ˈrʌɡ.bi/", vi: "Bóng bầu dục" },
            { en: "Sail", ipa: "/seɪl/", vi: "Cánh buồm, lướt buồm" },
            { en: "Skateboard", ipa: "/ˈskeɪt.bɔːrd/", vi: "Ván trượt" },
            { en: "Skiing", ipa: "/ˈskiː.ɪŋ/", vi: "Môn trượt tuyết" },
            { en: "Snowboard", ipa: "/ˈsnoʊ.bɔːrd/", vi: "Ván trượt tuyết" },
            { en: "Squash", ipa: "/skwɑːʃ/", vi: "Môn bóng quần" },
            { en: "Surfboard", ipa: "/ˈsɝːf.bɔːrd/", vi: "Ván lướt sóng" },
            { en: "Tracksuit", ipa: "/ˈtræk.suːt/", vi: "Bộ đồ thể thao" }
        ];

        let currentIndex = 0;

        const cardElement = document.getElementById('flashcard');
        const enWord = document.getElementById('en-word');
        const ipaText = document.getElementById('ipa-text');
        const viMeaning = document.getElementById('vi-meaning');
        const currentCountText = document.getElementById('current-count');
        const totalCountText = document.getElementById('total-count');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function init() {
            totalCountText.textContent = flashcards.length;
            updateCard();
        }

        function updateCard() {
            cardElement.classList.remove('is-flipped');
            
            setTimeout(() => {
                const card = flashcards[currentIndex];
                enWord.textContent = card.en;
                ipaText.textContent = card.ipa;
                viMeaning.textContent = card.vi;
                currentCountText.textContent = currentIndex + 1;
                
                prevBtn.disabled = currentIndex === 0;
                nextBtn.disabled = currentIndex === flashcards.length - 1;
            }, 200);
        }

        function flipCard() {
            cardElement.classList.toggle('is-flipped');
        }

        function nextCard() {
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        init();
    </script>
</body>
</html>
