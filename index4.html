<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Flashcards - Shopping & Sports</title>
    <style>
        :root {
            --primary: #4A90E2;
            --secondary: #F39C12;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-front: #333333;
            --text-back: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 30px;
            text-align: center;
        }

        .flashcard-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .flashcard {
            background-color: transparent;
            width: 100%;
            height: 180px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 12px;
        }

        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
        }

        .flashcard-front {
            background-color: var(--card-bg);
            color: var(--text-front);
            border: 2px solid #e1e8ed;
        }

        .flashcard-back {
            background-color: var(--primary);
            color: var(--text-back);
            transform: rotateY(180deg);
        }

        .flashcard-front h2 {
            margin: 0;
            font-size: 1.5em;
            color: var(--primary);
        }

        .flashcard-back h2 {
            margin: 0;
            font-size: 1.4em;
            font-weight: 500;
        }

        .category {
            font-size: 0.8em;
            color: #888;
            position: absolute;
            top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .flashcard-back .category {
            color: rgba(255, 255, 255, 0.7);
        }

        .instruction {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-style: italic;
        }
        
        @media (max-width: 600px) {
            .flashcard-container {
                grid-template-columns: repeat(auto-fill, minmax(100%, 1fr));
            }
        }
        /* ==========================================================================
   GIAO DIỆN DÀNH CHO MÀN HÌNH ĐIỆN THOẠI (Mobile) - Max width 480px
   ========================================================================== */
@media screen and (max-width: 480px) {
    
    /* 1. Tối ưu lại container chứa nội dung */
    .container {
        width: 100% !important;
        max-width: 100% !important;
        padding: 15px !important; /* Thu nhỏ padding để tăng không gian hiển thị */
        margin: 0 auto;
        box-shadow: none !important; /* Bỏ bóng đổ cho nhẹ máy và thoáng màn hình */
        border: none !important; /* Bỏ viền nếu cần thiết */
    }

    /* 2. Ép các lưới (Grid) hoặc hàng (Flexbox) về dạng 1 cột dọc */
    .menu-grid, .grid-layout, .row {
        display: grid !important;
        grid-template-columns: 1fr !important; /* Chuyển thành 1 cột duy nhất */
        gap: 12px !important;
    }

    /* 3. Điều chỉnh lại kích thước chữ (Font size) cho vừa mắt trên phone */
    h1 {
        font-size: 20px !important; /* Giảm size tiêu đề chính */
        margin-bottom: 8px !important;
    }

    h2 {
        font-size: 18px !important;
    }

    p, span, a {
        font-size: 14px !important; /* Size chữ body chuẩn trên mobile */
    }

    /* 4. Tối ưu hóa các nút bấm (Button / Link) cho dễ chạm bằng ngón tay */
    .btn-link, button, .button {
        padding: 12px !important; /* Không gian vừa đủ để ngón tay dễ ấn */
        font-size: 15px !important;
        width: 100%; /* Cho nút trải dài hết chiều ngang màn hình */
        box-sizing: border-box;
    }
}
    </style>
</head>
<body>

    <h1>Vocabulary Flashcards</h1>
    <p class="instruction">Nhấp vào thẻ để xem nghĩa tiếng Việt</p>

    <div class="flashcard-container" id="card-container">
        <!-- Cards will be generated here by JavaScript -->
    </div>

    <script>
        const vocabulary = [
            { word: "bargain", meaning: "món hời, sự mặc cả", category: "Shopping" },
            { word: "deposit", meaning: "tiền cọc, đặt cọc", category: "Shopping" },
            { word: "exchange", meaning: "sự trao đổi, đổi hàng", category: "Shopping" },
            { word: "expensive", meaning: "đắt đỏ", category: "Shopping" },
            { word: "inexpensive", meaning: "không đắt, rẻ", category: "Shopping" },
            { word: "penny/cent", meaning: "đồng xu", category: "Shopping" },
            { word: "cheque", meaning: "séc (ngân hàng)", category: "Shopping" },
            { word: "pound", meaning: "đồng bảng Anh", category: "Shopping" },
            { word: "reasonable", meaning: "hợp lý (giá cả)", category: "Shopping" },
            { word: "receipt", meaning: "biên lai", category: "Shopping" },
            { word: "reduce", meaning: "giảm giá", category: "Shopping" },
            { word: "reduced", meaning: "đã được giảm giá", category: "Shopping" },
            { word: "rent", meaning: "thuê (dài hạn, thuê nhà)", category: "Shopping" },
            { word: "reserve", meaning: "đặt trước", category: "Shopping" },
            { word: "athlete", meaning: "vận động viên", category: "Sport" },
            { word: "extreme sport", meaning: "thể thao mạo hiểm", category: "Sport" },
            { word: "bathing suit", meaning: "đồ bơi", category: "Sport" },
            { word: "gymnastics", meaning: "thể dục dụng cụ", category: "Sport" },
            { word: "helmet", meaning: "mũ bảo hiểm", category: "Sport" },
            { word: "instructor", meaning: "người hướng dẫn", category: "Sport" },
            { word: "jogging", meaning: "chạy bộ thể dục", category: "Sport" },
            { word: "compete", meaning: "thi đấu, cạnh tranh", category: "Sport" },
            { word: "contest", meaning: "cuộc thi", category: "Sport" },
            { word: "competitor", meaning: "người thi đấu", category: "Sport" },
            { word: "court", meaning: "sân (tennis, bóng rổ, cầu lông)", category: "Sport" },
            { word: "surfing", meaning: "môn lướt sóng", category: "Sport" },
            { word: "surfboard", meaning: "ván lướt sóng", category: "Sport" },
            { word: "take part", meaning: "tham gia", category: "Sport" },
            { word: "throw", meaning: "ném", category: "Sport" },
            { word: "rugby", meaning: "bóng bầu dục", category: "Sport" },
            { word: "tracksuit", meaning: "bộ đồ thể thao", category: "Sport" },
            { word: "sail", meaning: "chèo thuyền, đua thuyền buồm", category: "Sport" },
            { word: "water skiing", meaning: "trượt ván nước", category: "Sport" },
            { word: "workout", meaning: "buổi tập thể dục", category: "Sport" }
        ];

        const container = document.getElementById('card-container');

        vocabulary.forEach(item => {
            const card = document.createElement('div');
            card.className = 'flashcard';
            card.innerHTML = `
                <div class="flashcard-inner">
                    <div class="flashcard-front">
                        <span class="category">${item.category}</span>
                        <h2>${item.word}</h2>
                    </div>
                    <div class="flashcard-back">
                        <span class="category">${item.category}</span>
                        <h2>${item.meaning}</h2>
                    </div>
                </div>
            `;
            
            // Add click event to flip
            card.addEventListener('click', function() {
                this.classList.toggle('flipped');
            });

            container.appendChild(card);
        });
    </script>
</body>
</html>
