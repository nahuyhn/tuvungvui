<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Flashcards - House and Home</title>
    <style>
        :root {
            --primary: #e67e22; /* Màu cam ấm áp cho chủ đề nhà cửa */
            --bg-color: #fcf9f5;
            --card-bg: #ffffff;
            --text-front: #2c3e50;
            --text-back: #ffffff;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        h1 { color: var(--primary); margin-bottom: 10px; text-align: center; }
        .instruction { text-align: center; color: #7f8c8d; margin-bottom: 30px; font-style: italic; }
        .flashcard-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 20px; 
            width: 100%; 
            max-width: 1200px; 
        }
        .flashcard { background-color: transparent; width: 100%; height: 180px; perspective: 1000px; cursor: pointer; }
        .flashcard-inner { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            text-align: center; 
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); 
            transform-style: preserve-3d; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.08); 
            border-radius: 15px; 
        }
        .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            border-radius: 15px; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        .flashcard-front { background-color: var(--card-bg); color: var(--text-front); border: 2px solid #f3e5d8; }
        .flashcard-back { background-color: var(--primary); color: var(--text-back); transform: rotateY(180deg); }
        .flashcard-front h2 { margin: 0; font-size: 1.6em; color: var(--text-front); }
        .flashcard-back h2 { margin: 0; font-size: 1.4em; font-weight: 500; line-height: 1.4; }
        .category { 
            font-size: 0.75em; 
            color: #bdc3c7; 
            position: absolute; 
            top: 15px; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
        }
        .flashcard-back .category { color: rgba(255, 255, 255, 0.6); }
        @media (max-width: 600px) { .flashcard-container { grid-template-columns: repeat(auto-fill, minmax(100%, 1fr)); } }
    /* ==========================================================================
   GIAO DIỆN DÀNH CHO MÀN HÌNH ĐIỆN THOẠI (Mobile) - Max width 480px
   ========================================================================== */
@media screen and (max-width: 480px) {
    
    /* 1. Tối ưu lại container chứa nội dung */
    .container {
        width: 100% !important;
        max-width: 100% !important;
        padding: 15px !important; /* Thu nhỏ padding để tăng không gian hiển thị */
        margin: 0 auto;
        box-shadow: none !important; /* Bỏ bóng đổ cho nhẹ máy và thoáng màn hình */
        border: none !important; /* Bỏ viền nếu cần thiết */
    }

    /* 2. Ép các lưới (Grid) hoặc hàng (Flexbox) về dạng 1 cột dọc */
    .menu-grid, .grid-layout, .row {
        display: grid !important;
        grid-template-columns: 1fr !important; /* Chuyển thành 1 cột duy nhất */
        gap: 12px !important;
    }

    /* 3. Điều chỉnh lại kích thước chữ (Font size) cho vừa mắt trên phone */
    h1 {
        font-size: 20px !important; /* Giảm size tiêu đề chính */
        margin-bottom: 8px !important;
    }

    h2 {
        font-size: 18px !important;
    }

    p, span, a {
        font-size: 14px !important; /* Size chữ body chuẩn trên mobile */
    }

    /* 4. Tối ưu hóa các nút bấm (Button / Link) cho dễ chạm bằng ngón tay */
    .btn-link, button, .button {
        padding: 12px !important; /* Không gian vừa đủ để ngón tay dễ ấn */
        font-size: 15px !important;
        width: 100%; /* Cho nút trải dài hết chiều ngang màn hình */
        box-sizing: border-box;
    }
}
    </style>
</head>
<body>

    <h1>Flashcards - House and Home</h1>
    <p class="instruction">Nhấp vào từng thẻ để xem nghĩa tiếng Việt</p>

    <div class="flashcard-container" id="card-container"></div>

    <script>
        const vocabulary = [
            { word: "hall", meaning: "hành lang, sảnh" },
            { word: "handle", meaning: "tay cầm, tay nắm cửa" },
            { word: "antique", meaning: "đồ cổ" },
            { word: "ladder", meaning: "cái thang" },
            { word: "blanket/duvet", meaning: "chăn (mền) / chăn lông vũ" },
            { word: "neighbour", meaning: "người hàng xóm" },
            { word: "bulb", meaning: "bóng đèn" },
            { word: "carpet", meaning: "tấm thảm" },
            { word: "candle", meaning: "cây nến" },
            { word: "frying pan", meaning: "chảo chiên" },
            { word: "pipe", meaning: "ống nước" },
            { word: "property", meaning: "tài sản, bất động sản" },
            { word: "refrigerator", meaning: "tủ lạnh" },
            { word: "cupboard", meaning: "tủ chén bát" },
            { word: "roommate / flatmate", meaning: " bạn cùng phòng / bạn cùng căn hộ" },
            { word: "rubbish / dustbin", meaning: "rác thải / thùng rác" },
            { word: "sink", meaning: "bồn rửa (bát)" },
            { word: "furniture", meaning: "đồ nội thất" },
            { word: "surround", meaning: "bao quanh" },
            { word: "towel", meaning: "khăn tắm" },
            { word: "vase", meaning: "bình hoa" },
            { word: "curtain", meaning: "rèm cửa" },
            { word: "mug", meaning: "cái cốc (có quai)" },
            { word: "jug / kettle", meaning: "cái bình (đựng nước) / ấm đun nước" },
            { word: "basin", meaning: "bồn rửa (mặt)" }
        ];

        const container = document.getElementById('card-container');

        vocabulary.forEach(item => {
            const card = document.createElement('div');
            card.className = 'flashcard';
            card.innerHTML = `
                <div class="flashcard-inner">
                    <div class="flashcard-front">
                        <span class="category">House & Home</span>
                        <h2>${item.word}</h2>
                    </div>
                    <div class="flashcard-back">
                        <span class="category">House & Home</span>
                        <h2>${item.meaning}</h2>
                    </div>
                </div>
            `;
            
            card.addEventListener('click', function() {
                this.classList.toggle('flipped');
            });

            container.appendChild(card);
        });
    </script>
</body>
</html>
