<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Flashcards</title>
    <style>
        :root {
            --primary: #3f51b5; /* Màu xanh indigo hiện đại */
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-front: #333333;
            --text-back: #ffffff;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        h1 { color: var(--primary); margin-bottom: 5px; text-align: center; }
        .instruction { text-align: center; color: #666; margin-bottom: 30px; font-style: italic; }
        .flashcard-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 20px; 
            width: 100%; 
            max-width: 1200px; 
        }
        .flashcard { background-color: transparent; width: 100%; height: 180px; perspective: 1000px; cursor: pointer; }
        .flashcard-inner { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            text-align: center; 
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); 
            transform-style: preserve-3d; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            border-radius: 12px; 
        }
        .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            border-radius: 12px; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        .flashcard-front { background-color: var(--card-bg); color: var(--text-front); border: 2px solid #e0e4e8; }
        .flashcard-back { background-color: var(--primary); color: var(--text-back); transform: rotateY(180deg); }
        .flashcard-front h2 { margin: 0; font-size: 1.5em; color: var(--text-front); }
        .flashcard-back h2 { margin: 0; font-size: 1.3em; font-weight: 500; line-height: 1.4; }
        .category { 
            font-size: 0.75em; 
            color: #999; 
            position: absolute; 
            top: 15px; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
        }
        .flashcard-back .category { color: rgba(255, 255, 255, 0.7); }
        @media (max-width: 600px) { .flashcard-container { grid-template-columns: repeat(auto-fill, minmax(100%, 1fr)); } }
    </style>
</head>
<body>

    <h1>Vocabulary Flashcards</h1>
    <p class="instruction">Nhấp vào từng thẻ để lật và xem nghĩa tiếng Việt</p>

    <div class="flashcard-container" id="card-container"></div>

    <script>
        const vocabulary = [
            // Education
            { word: "absent", meaning: "vắng mặt, nghỉ học", category: "Education" },
            { word: "advanced", meaning: "nâng cao, cấp độ cao", category: "Education" },
            { word: "arithmetic", meaning: "số học", category: "Education" },
            { word: "intermediate", meaning: "trung cấp", category: "Education" },
            { word: "instructions", meaning: "hướng dẫn, lời chỉ dẫn", category: "Education" },
            { word: "blackboard", meaning: "bảng đen", category: "Education" },
            { word: "break up", meaning: "nghỉ hè, kết thúc học kỳ", category: "Education" },
            { word: "college", meaning: "trường cao đẳng, đại học", category: "Education" },
            { word: "clever", meaning: "thông minh, lanh lợi", category: "Education" },
            { word: "nature studies", meaning: "môn nghiên cứu tự nhiên", category: "Education" },
            { word: "notice board", meaning: "bảng thông báo", category: "Education" },
            { word: "curriculum", meaning: "chương trình giảng dạy", category: "Education" },
            { word: "pencil case", meaning: "hộp đựng bút", category: "Education" },
            { word: "pupil / student", meaning: "học sinh / sinh viên", category: "Education" },
            { word: "elementary", meaning: "sơ cấp, cơ bản", category: "Education" },
            { word: "essay", meaning: "bài tiểu luận, bài văn", category: "Education" },
            { word: "rubber", meaning: "cục tẩy", category: "Education" },

            // Entertainment
            { word: "act", meaning: "diễn xuất, hành động", category: "Entertainment" },
            { word: "exhibition", meaning: "cuộc triển lãm", category: "Entertainment" },
            { word: "advert", meaning: "bài quảng cáo", category: "Entertainment" },
            { word: "interval", meaning: "thời gian nghỉ giữa hiệp/buổi diễn", category: "Entertainment" },
            { word: "circus", meaning: "rạp xiếc", category: "Entertainment" },

            // Clothes and Accessories
            { word: "laundry", meaning: "quần áo cần giặt, tiệm giặt ủi", category: "Clothes" },
            { word: "leather", meaning: "da (chất liệu)", category: "Clothes" },
            { word: "blouse", meaning: "áo sơ mi nữ", category: "Clothes" },
            { word: "material", meaning: "chất liệu, vật liệu", category: "Clothes" },
            { word: "bracelet", meaning: "vòng đeo tay", category: "Clothes" },
            { word: "necklace", meaning: "vòng cổ, dây chuyền", category: "Clothes" },
            { word: "pattern", meaning: "họa tiết, hoa văn", category: "Clothes" },
            { word: "pullover", meaning: "áo len chui đầu", category: "Clothes" },
            { word: "purse", meaning: "ví nữ (đựng tiền lẻ)", category: "Clothes" },
            { word: "raincoat", meaning: "áo mưa", category: "Clothes" },
            { word: "sandal", meaning: "dép xăng-đan", category: "Clothes" },
            { word: "handkerchief", meaning: "khăn tay", category: "Clothes" },
            { word: "sleeve", meaning: "tay áo", category: "Clothes" },
            { word: "stripe", meaning: "sọc, kẻ sọc", category: "Clothes" },
            { word: "jumper", meaning: "áo len mặc ngoài (Anh-Anh)", category: "Clothes" },
            { word: "tights", meaning: "quần tất", category: "Clothes" },
            { word: "trousers", meaning: "quần dài", category: "Clothes" },
            { word: "underpants", meaning: "quần lót (nam)", category: "Clothes" },
            { word: "wool", meaning: "len / (làm bằng) len", category: "Clothes" },

            // Communications and Technology
            { word: "ring up", meaning: "gọi điện thoại", category: "Technology" },
            { word: "engaged", meaning: "máy bận (điện thoại)", category: "Technology" },
            { word: "envelope", meaning: "phong bì", category: "Technology" }
        ];

        const container = document.getElementById('card-container');

        vocabulary.forEach(item => {
            const card = document.createElement('div');
            card.className = 'flashcard';
            card.innerHTML = `
                <div class="flashcard-inner">
                    <div class="flashcard-front">
                        <span class="category">${item.category}</span>
                        <h2>${item.word}</h2>
                    </div>
                    <div class="flashcard-back">
                        <span class="category">${item.category}</span>
                        <h2>${item.meaning}</h2>
                    </div>
                </div>
            `;
            
            card.addEventListener('click', function() {
                this.classList.toggle('flipped');
            });

            container.appendChild(card);
        });
    </script>
</body>
</html>
